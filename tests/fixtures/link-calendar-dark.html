<!doctype html>
<html class="theme-dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Calendar dark fixture</title>
  <link rel="stylesheet" href="../../styles.css?v=3.1.3">
  <style>
    :root {
      --background-primary: #191919;
      --background-secondary: #202020;
      --background-secondary-alt: #262626;
      --background-modifier-hover: #2f2f2f;
      --background-modifier-active-hover: #383838;
      --background-modifier-border-hover: #606060;
      --divider-color: #303030;
      --text-normal: #f1f1ef;
      --text-muted: #a8a8a5;
      --text-faint: #777775;
      --text-on-accent: #ffffff;
      --interactive-accent: #0a84ff;
      --interactive-accent-hover: #409cff;
      --text-warning: #ffd60a;
      --text-error: #ff453a;
      --font-interface: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-monospace: ui-monospace, monospace;
      --font-ui-smaller: 11px;
      --font-ui-small: 12px;
      --font-ui-medium: 13px;
      --font-ui-large: 16px;
      --h3-size: 22px;
      --h4-size: 18px;
      --font-medium: 500;
      --font-semibold: 600;
      --font-bold: 700;
      --line-height-normal: 1.45;
      --letter-spacing-tight: -0.02em;
      --letter-spacing-wide: 0.04em;
      --size-4-1: 4px;
      --size-4-2: 8px;
      --size-4-3: 12px;
      --size-4-4: 16px;
      --size-4-5: 20px;
      --size-4-6: 24px;
      --size-4-8: 32px;
      --radius-s: 4px;
      --radius-m: 8px;
      --radius-l: 12px;
      --radius-xl: 999px;
      --shadow-l: 0 16px 48px #0008;
      --anim-duration-fast: 120ms;
      --anim-duration-moderate: 220ms;
      --anim-motion-smooth: ease;
      --input-height: 30px;
      --icon-size: 14px;
      --focus-ring-width: 2px;
      --border-width: 1px;
      --color-blue: #0a84ff;
      --color-cyan: #64d2ff;
      --color-green: #30d158;
      --color-orange: #ff9f0a;
      --color-pink: #ff375f;
      --color-purple: #bf5af2;
      --color-red: #ff453a;
      --color-yellow: #ffd60a;
    }
    html.theme-light {
      --background-primary: #ffffff;
      --background-secondary: #f5f5f3;
      --background-secondary-alt: #ececea;
      --background-modifier-hover: #e7e7e4;
      --background-modifier-active-hover: #ddddda;
      --background-modifier-border-hover: #9a9a96;
      --divider-color: #ddddda;
      --text-normal: #20201e;
      --text-muted: #62625f;
      --text-faint: #888884;
      --text-on-accent: #ffffff;
      --interactive-accent: #006edc;
      --interactive-accent-hover: #005fc2;
      --text-warning: #9a6700;
      --text-error: #c52828;
      --shadow-l: 0 16px 48px #0002;
    }
    html, body, .workspace-leaf-content, .view-content { height: 100%; margin: 0; }
    body.is-overview .link-calendar__body { grid-template-columns: minmax(0, 1fr); }
    body.is-overview .link-calendar__side { display: none; }
  </style>
</head>
<body>
  <main class="workspace-leaf-content">
    <div class="view-content link-calendar-view">
      <div class="link-calendar">
        <header class="link-calendar__header">
          <div class="link-calendar__navigation"><button>‹</button><button>›</button><button class="link-calendar__today">Today</button></div>
          <h1 class="link-calendar__title">August 2026</h1>
          <div class="link-calendar__tools"><div class="link-calendar__search"><input aria-label="Search events" placeholder="Search events"></div><button>↗</button><button>⚙</button></div>
        </header>
        <div class="link-calendar__body has-side">
          <section class="link-calendar__month">
            <div class="link-calendar__grid weeks-5" role="grid" aria-label="August 2026">
              <div class="link-calendar__weekday">Sun</div><div class="link-calendar__weekday">Mon</div><div class="link-calendar__weekday">Tue</div><div class="link-calendar__weekday">Wed</div><div class="link-calendar__weekday">Thu</div><div class="link-calendar__weekday">Fri</div><div class="link-calendar__weekday">Sat</div>
              <div class="link-calendar__day is-outside"><span class="link-calendar__day-number">26</span></div>
              <div class="link-calendar__day is-outside"><span class="link-calendar__day-number">27</span></div>
              <div class="link-calendar__day is-outside"><span class="link-calendar__day-number">28</span></div>
              <div class="link-calendar__day is-outside"><span class="link-calendar__day-number">29</span></div>
              <div class="link-calendar__day is-outside"><span class="link-calendar__day-number">30</span></div>
              <div class="link-calendar__day is-outside"><span class="link-calendar__day-number">31</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">1</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">2</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">3</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">4</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">5</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">6</span><div class="link-calendar__markers"><button class="link-calendar__marker" aria-label="Design review"><span class="link-calendar__marker-dot"></span></button></div></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">7</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">8</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">9</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">10</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">11</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">12</span><div class="link-calendar__markers"><button class="link-calendar__marker" aria-label="Research notes review"><span class="link-calendar__marker-dot"></span></button></div></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">13</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">14</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">15</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">16</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">17</span><div class="link-calendar__markers"><button class="link-calendar__marker" aria-label="Study plan checkpoint"><span class="link-calendar__marker-dot"></span></button></div></div>
              <div class="link-calendar__day is-selected"><span class="link-calendar__day-number is-today">18</span><div class="link-calendar__markers"><button class="link-calendar__marker" aria-label="Release checklist"><span class="link-calendar__marker-dot"></span></button><button class="link-calendar__marker is-active" aria-label="Product launch and release notes"><span class="link-calendar__marker-dot"></span></button></div></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">19</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">20</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">21</span><div class="link-calendar__markers"><button class="link-calendar__marker" aria-label="Interview preparation"><span class="link-calendar__marker-dot"></span></button></div></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">22</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">23</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">24</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">25</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">26</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">27</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">28</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">29</span><div class="link-calendar__markers"><button class="link-calendar__marker" aria-label="Architecture workshop"><span class="link-calendar__marker-dot"></span></button></div></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">30</span></div>
              <div class="link-calendar__day"><span class="link-calendar__day-number">31</span></div>
              <div class="link-calendar__day is-outside"><span class="link-calendar__day-number">1</span></div>
              <div class="link-calendar__day is-outside"><span class="link-calendar__day-number">2</span></div>
              <div class="link-calendar__day is-outside"><span class="link-calendar__day-number">3</span></div>
              <div class="link-calendar__day is-outside"><span class="link-calendar__day-number">4</span></div>
              <div class="link-calendar__day is-outside"><span class="link-calendar__day-number">5</span></div>
            </div>
          </section>
          <aside class="link-calendar__side" id="link-calendar-page-peek">
            <div class="link-calendar__side-topbar"><div class="link-calendar__side-date">August 18, 2026</div><button>×</button></div>
            <div class="link-calendar__agenda">
              <div class="link-calendar__agenda-label">2 events on this date</div>
              <div class="link-calendar__agenda-item"><time class="link-calendar__agenda-time">15:30–16:00</time><div class="link-calendar__agenda-identity"><a class="link-calendar__agenda-link internal-link" href="Calendar/Release checklist.md" data-href="Calendar/Release checklist.md" aria-label="Open note: Release checklist" title="Open note: Release checklist">Release checklist</a></div></div>
              <div class="link-calendar__agenda-item is-active"><time class="link-calendar__agenda-time">16:00–17:30</time><div class="link-calendar__agenda-identity"><a class="link-calendar__agenda-link internal-link" href="Calendar/Product launch and release notes.md" data-href="Calendar/Product launch and release notes.md" aria-label="Open note: Product launch and release notes" title="Open note: Product launch and release notes">Product launch and release notes</a></div></div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </main>
  <script>
    const fixtureOptions = new URLSearchParams(window.location.search);
    if (fixtureOptions.has("light")) {
      document.documentElement.className = "theme-light";
    }
    if (fixtureOptions.has("overview")) {
      document.body.classList.add("is-overview");
    }
  </script>
</body>
</html>
