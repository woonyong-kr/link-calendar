name: Release assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact manifest version
        required: true

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be created from main." >&2
          exit 1
      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: test "$(node -p 'require("./manifest.json").version')" = "$REQUESTED_VERSION"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          create-storage-record: false
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: >-
          gh release create "$REQUESTED_VERSION"
          --draft
          --generate-notes
          --target "$GITHUB_SHA"
          main.js manifest.json styles.css
