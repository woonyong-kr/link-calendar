name: OAuth relay

on:
  workflow_dispatch:

concurrency:
  group: oauth-relay-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LINK_CALENDAR_GOOGLE_RELAY_URL: ${{ vars.LINK_CALENDAR_GOOGLE_RELAY_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:oauth
      - name: Deploy relay adapter
        run: npm exec --yes wrangler@4.128.0 -- deploy --config oauth-worker/wrangler.jsonc
      - name: Verify deployed protocol
        run: npm run verify:relay
